name: Weekly Boss Reset

on:
  schedule:
    # UTC 시간 기준 수요일 15:00 = 한국 시간 기준 목요일 자정(00:00)
    - cron: '0 15 * * 3'
  workflow_dispatch: # 수동 테스트용 버튼

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset is_cleared to false
        run: |
          curl -X PATCH "https://wwtlccjhiearimyuquwh.supabase.co/rest/v1/parties?is_cleared=eq.true" \
          -H "apikey: sb_publishable_cJRd9WgKIcPA1xGGuXO4gA_6geEwGGD" \
          -H "Authorization: Bearer sb_publishable_cJRd9WgKIcPA1xGGuXO4gA_6geEwGGD" \
          -H "Content-Type: application/json" \
          -H "Prefer: return=minimal" \
          -d '{"is_cleared": false}'